  notes:
    - >-
      Module layout, following TASK-03's Identity module: endpoints and the commands/queries that use MentorDbContext
      live in src/Mentor.Api/<Module>/ with an Add<Module>/Map<Module> pair registered on their own lines in
      ApiHost.cs; pure rules (ProfileDetails validation) live in Mentor.Core and are unit-tested.
    - >-
      GET /api/employees/me creates the employee record on the caller's first access, seeded with the display name the
      token or roster carries; PUT /api/employees/me creates it when absent and otherwise updates display attributes.
      GET /api/session still creates nothing, so Caller.EmployeeId stays null for an employee who has never opened
      their profile. A module that acts on the caller's own records (mentor application, request) should refuse such a
      caller (the frontend opens the profile right after sign-in) rather than create the record itself: CallerResolver
      caches the Caller per request, so a record created mid-request would still be seen as owning nothing by any
      later record check in that request.
    - >-
      The seed a first access takes from the identity goes through ProfileDetails.TrySeed, which is TryCreate with no
      level: the same required/200-character rule as a PUT, so no employee row can hold a display name a save would
      refuse (the column is NOT NULL with no CHECK constraint, so the module is the guard). An Entra token with
      neither a name nor a preferred_username claim (requested without the profile scope, or by a client other than
      the SPA) resolves to an empty Caller.DisplayName; GET /api/employees/me then creates nothing and invents nothing,
      and answers 404 with a problem titled "No profile yet" whose detail never repeats the identity's name, until
      PUT /api/employees/me, validated as every save is, creates the record. ReadOwnAsync reports this as
      OwnProfileLookup.AwaitingDetails, distinct from Forbidden. The simulated roster always carries a name, so only
      the Entra scheme reaches this path; GET /api/session is unchanged and reports the identity's name as the token
      carried it (TASK-03).
    - >-
      Record checks are made before anything is read: for an employee record the matrix needs only its id (its owner),
      so the module checks new ProtectedRecord { Owner = id } from the route or the caller and only then loads the row.
      A caller the matrix refuses gets 403 whether or not the id names anybody; only Talent Management can get a 404.
    - >-
      Edit bodies are strict: EmployeeProfileEdit carries JsonUnmappedMemberHandling.Disallow, so a body naming any
      other member (the identity key, the record id) is answered 400 rather than silently stripped. Validation errors
      come back as a ValidationProblem keyed by camelCase property name and never repeat the submitted value.
    - >-
      Under default deny, a method a known route does not answer gets 403 (401 anonymous), not 405: the 405 endpoint
      carries no permission, so UndeclaredPermissionRequirement refuses it.
    - >-
      Profile edits are not audited (ADR-007 names no such action and AuditAction has none) and the employee row has
      no version column, so there is no ETag/If-Match on these routes (ADR-005 scopes them to candidates and
      relationships).
    - >-
      Two concurrent first accesses by one caller both end with the one record: the unique index on entra_object_id
      refuses the second insert and the loser adopts the winner's row.
