  notes:
  - 'Routes: GET /api/register (register.read), GET /api/register/export (register.export,
    text/csv; charset=utf-8 with BOM, attachment mentorship-register-<UTC>.csv), GET
    /api/register/goals (register.read). The permissions already existed in the matrix
    (TASK-03).'
  - 'Interpretations: rows are historical first in tracker order (file, row), held
    rows included, then digital rows by formation time. A held row (UNRESOLVED_PERSON
    or NO_MENTOR) is listed until its source row is entered as a relationship. A held
    row shows its source names in the Mentor/Protégé columns. Levels are the employees''
    current level_title. The Review exception column reads "Unresolved value: Status,
    IsActive", "Unresolved person" or "No mentor". "Source date text" names each cell
    ("Start: ...; End: ..."). Business values follow the BRS wording (In Progress, On
    hold, Complete; Needs reassigning; 6 months, 12 months, 12+ months).'
  - 'Security: CSV cells that would start a formula (=, +, -, @, tab, CR) are prefixed
    with an apostrophe in the export only; the JSON keeps source text verbatim. Content-Disposition
    is added to the CORS exposed headers so that the frontend can read the file name.'
  - 'Audit: REGISTER_EXPORTED (record type REGISTER, no record id) with format, relationshipRows
    and heldSourceRows is committed before the file is returned. The read runs in a
    read-only REPEATABLE READ snapshot and the audit write in its own READ COMMITTED
    transaction (ADR-013). A Talent Management caller without an employee record gets
    409 (EmployeeRecordRequired) for an export. Reading the register is not audited
    (ADR-011 audits exports).'
  - 'Refactor: the goal view construction moved from GoalsAndProgress into GoalViewReader,
    which opens no transaction, so that the goals view reads all goals inside its own
    snapshot. GoalsAndProgress behaviour is unchanged (its tests pass).'
  - 'Mutation check: 10 deliberate regressions, 9 built and all 9 were caught (held-row
    filter, review derivation, export audit, two permission swaps, Blank written, no-store,
    held source names, goal summary). One mutant did not compile (unreachable code is
    an error); its case is covered by a unit test. All mutated files restored and
    rebuilt clean.'
