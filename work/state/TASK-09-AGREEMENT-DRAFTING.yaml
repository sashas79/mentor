        A revision's content holds the identified participants (employee id and display name, written by the server from
        the candidate), the fixed policy (voluntary partnership, SMART goals, avoiding cancellation, agreeing the next
        meeting, regular review, confidentiality, honest constructive feedback, openness to feedback, amicable
