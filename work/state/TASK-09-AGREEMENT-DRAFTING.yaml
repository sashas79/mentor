  notes:
    - >-
      Module layout follows TASK-06 to TASK-08. Mentor.Core.Agreements holds the pure, unit-tested rules: CanonicalJson
      (RFC 8785), AgreementText (CRLF to LF, NFC, trim, control characters), AgreementPolicy (the fixed clauses),
      AgreementContent and AgreementDraftDetails (the content document and its validation), AgreementDraftForm (strict
      request body), AgreementWorkflow (which status admits draft operations; the derived step) and AnnexChange.
      Mentor.Api.Agreements holds the scoped AgreementDrafts service, the views and strict bodies
      (AgreementDraftViews.cs) and AgreementDraftEndpoints (AddAgreementDrafting/MapAgreementDrafting on ApiHost's module
      lines). The ADR-005 version claim moved from Candidates.DecideAsync into CandidateVersion.ClaimAsync, which both
      modules use.
    - >-
      Routes (every POST needs If-Match; every response carries the candidate version as ETag): GET
      /api/candidates/{candidateId}/draft; POST .../draft/revisions (201 with Location and ETag); GET
      .../draft/revisions/{revisionId}; POST .../draft/revisions/{revisionId}/acceptances, body { contentHash }; POST
      .../draft/annex, body { basis, value }. New problem titles: "Revision superseded" (409), "Content mismatch" (422),
      "Content unchanged" (409), "Annex unchanged" (409); reused: "Version required" (428), "Candidate changed" (409),
      "Not possible in the candidate's current state" (409), "No employee profile yet" (409).
    - >-
      Content contract (CONTRACT-AGREEMENT-CONTENT): the stored document is RFC 8785 canonical JSON and content_hash is
      the SHA-256 hex of its UTF-8 bytes, so anyone can recompute it. The server writes the parties (employee id and
      display name) and the policy; participants submit terms, goals, barriers, contingencies and responsibilities only.
      The document uses stored enumeration values (SIX_MONTHS, WEEKS), dates as yyyy-MM-dd and explicit nulls; the API
      returns typed content with PascalCase enumerations. Text is normalised, so the same words make the same hash, and
      resubmitting the current content is 409 "Content unchanged".
    - >-
      For the operator to confirm: the policy clause wording is authored from the BRS description because SRC-03 (the
      original agreement) is not supplied, and Talent Management should check it against the original; the
      between-meeting contact limit is modelled as { interval, unit DAYS or WEEKS }, an interpretation of "the source's
      weeks/days wording". Changing either is a code change in AgreementPolicy or AgreementContent and alters future
      hashes only.
    - >-
      Administrative annex: Talent Management only, from the start of drafting until the candidate leaves DRAFTING
      (ADR-015); reference up to 100 characters on one line, remarks up to 500 with line breaks; a blank value clears the
      field, and an unchanged value is 409. The annex belongs to the candidate, not a revision, so it survives a
      replacement. Participants see it, labelled "Administrative, not part of the accepted agreement".
    - >-
      Audit (ADR-007): RevisionCreated (record AgreementRevision; outcome RESET_TO_STEP_1 and Invalidated =
      InapplicableEvidenceAsync(prior current revision) only for a replacement), AcceptanceRecorded (record
      AgreementAcceptance; outcome ACCEPTED; participantEmployeeId), AnnexChanged (record PermittedChange; CandidateId
      only; field and basis). Notifications (ADR-009): RevisionCreated and AcceptanceRecorded go to the other participant
      with AcceptCurrentRevision, or None once both have accepted; Talent Management's pending formation work stays a
      query.
    - >-
      For TASK-10: AgreementWorkflow.StepOf returning 3 means both participants accepted the current revision. Read the
      terms, dates, duration and goals with AgreementContent.Parse(revision.Content), and copy the revision content
      byte-for-byte into formed_agreement (DraftApi.FormAsync seeds that shape: APPROVED decision, status FORMED with
      version + 1, relationship, formed agreement). Claim the candidate version with CandidateVersion.ClaimAsync and
      check under that lock that the decision's revision is still current, so a replacement racing an approval leaves
      exactly one of them (as DraftCommandTests shows for a replacement racing an acceptance).
