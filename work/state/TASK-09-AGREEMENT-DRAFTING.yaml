        the Pack (see notes).
    - criterion: AC-FR-022-02
      note: >-
        GET /api/candidates/{id}/draft and GET .../draft/revisions/{revisionId} return the complete content, policy text
        included, with its content hash, to the protégé, the mentor and Talent Management before anyone accepts; other
        employees are 403. An acceptance must name that hash (DraftContentTests, DraftAcceptanceTests).
    - criterion: AC-FR-023-01
      note: >-
        SixMonths, TwelveMonths and TwelvePlusMonths are each saved as a revision and read back
