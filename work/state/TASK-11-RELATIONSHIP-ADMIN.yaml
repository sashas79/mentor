  notes:
    - >-
      Module layout follows TASK-06 to TASK-10. Mentor.Core.Relationships.RelationshipEdit is the pure, unit-tested rule:
      the exact parsing of the three values and the changes an edit makes; it reuses Mentor.Core.Legacy.
      RelationshipAttribute for the three attribute names. Mentor.Api.Relationships holds the scoped
      RelationshipAdministration service, RelationshipVersion (the ADR-005 claim), RelationshipViews (view, strict body,
      refusal), RelationshipEndpoints (AddRelationshipAdministration/MapRelationshipAdministration on ApiHost's module
      lines) and AttributeValueSchemas (an OpenAPI schema transformer, registered by AddRelationshipAdministration for
      every document).
    - >-
      Routes: GET /api/relationships (relationship.read: the caller's own relationships, as protégé or mentor, oldest
      first; Talent Management's list of all is TASK-14's register); GET /api/relationships/{relationshipId} (the parties
      and Talent Management; ETag = the relationship's version); PATCH /api/relationships/{relationshipId}
      (relationship.update-attributes: Talent Management) with If-Match and body { state?, status?, isActive? }, each
      exactly InProgress, OnHold or Complete; Blank or NeedsReassigning; Y or N; null or absent means not named, and at
      least one is named; 200 with the view and the new ETag. Problems: "Version required" (428), "Relationship changed"
      (409, stale version), "Relationship unchanged" (409, every named attribute already holds its value), "No employee
      profile yet" (409); 400 validation problems keyed state, status, isActive or attributes; 404 for an id that is not a
      relationship.
    - >-
      Decisions: the body takes strings parsed exactly, because the API's global enum converter reads names
      case-insensitively and accepts numbers, which would let "y", 0 or 1 through as Y or N (FR-071); the OpenAPI document
      still publishes the exact values, with the three properties optional. An edit that changes nothing is 409, as in
      TASK-09. A legacy row's NULL is unknown and never written by an edit; an edit resolves it, audited from null.
      Attribute entries name no candidate (an attribute change is not a candidate decision), so they appear in the
      relationship's record history (GET /api/audit-trail/records/Relationship/{id}), not in the candidate evidence view.
      No notification is raised: ADR-009 lists none for attribute changes.
    - >-
      For later tasks: TASK-12 reads goals through the relationship (its id and parties are in this view); TASK-14's
      register can follow this view's provenance and source semantics; TASK-15's generated client chains edits with the
      ETag of each PATCH response and offers exactly the published values.
