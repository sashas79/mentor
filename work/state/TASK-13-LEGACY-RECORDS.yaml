    - criterion: AC-FR-062-02
      note: Non-date text such as "ongoing" is kept as source text. Only D/M/YYYY real dates are read, per the product_domain decision. A two-digit year, another order or separator, or an impossible day stays unknown.
    - criterion: AC-FR-063-01
      note: Entry is a reviewed SQL script, from infra/legacy-entry/, run under mentor_legacy_entry. There is no importer, entry screen or API route (HostEndpointsTests.No_endpoint_enters_a_historical_relationship), and no application assembly reads a spreadsheet (LegacyEntryScriptTests.Entry_takes_only_the_cells_and_the_resolved_people_and_needs_no_importer).
    - criterion: AC-FR-063-02
      note: An admitted row keeps every cell verbatim and its resolved employees (foreign keys), source file and row, entering administrator and actual entry time; the readable values are typed only as the recorded decisions allow.
    - criterion: AC-FR-063-03
      note: An unresolved person or a missing mentor holds the row whole as a review exception (UNRESOLVED_PERSON, NO_MENTOR). Each State, Status or IsActive the decisions leave unresolved is an UNRESOLVED_VALUE exception of the relationship. Nothing is guessed.
    - criterion: AC-FR-063-04
      note: Entry writes no candidate, revision, acceptance, formation decision, formed agreement or goal. The procedure takes no time, entrant or typed value; times are the database's time of entry. Authority is decided (REQ-BR-022).
    - criterion: AC-FR-064-01
      note: Entered rows carry provenance LEGACY and no candidate. The API reports them as Legacy with their source, and no digital lifecycle object exists for them.
    - criterion: AC-E2E-07
      note: A validated tracker row is entered through the real template and reported through the API and trail with its source provenance, unresolved values and dates, and legacy classification. Unresolved identities are review exceptions, nothing digital is fabricated, "ongoing" is not a date, and Active never sets IsActive.
    - criterion: AC-DR-001-01
      note: No employee is created by legacy entry. A historical name without an employee record is a review exception, and the legacy role cannot insert employees (TASK-02 PrivilegeTests).
    - criterion: AC-DR-014-01
      note: Each record written has a LEGACY_ENTRY audit entry with actor, action, record, structured values and true time. It names its source file and row, with provenance LEGACY_SOURCE and identity scheme DATABASE, distinct from application events.
    - criterion: AC-NFR-003-01
      note: Every reference is a foreign key to an existing employee. An unresolved identity is held as a review exception, never replaced with a guess.
    - criterion: AC-NFR-004-01
      note: Each legacy entry keeps its true actor, the database's entry time and its values; no historical event timestamp is stored or accepted.
    - criterion: AC-BR-022-01
      note: A Talent Management administrator's own legacy-entry account, once authorised with authorise-account.sql, enters rows attributed to that administrator. Two administrators' entries are each attributed to their own administrator.
    - criterion: AC-BR-022-02
