  notes:
    - >-
      Module layout follows TASK-06 to TASK-09. Mentor.Core.Formation holds the pure, unit-tested rules: FormationRules
      (the prerequisites of a decision, checked in ADR-005's order: mutual willingness column by column, the current
      revision, its hash, both identified participants' acceptances of exactly that revision) and FormationRecords (the
      relationship, formed agreement and goals composed from the candidate and the approved revision alone).
      Mentor.Api.Formation holds the scoped Formations service, the views and strict body (FormationViews.cs) and
      FormationEndpoints (AddFormation/MapFormation on ApiHost's module lines).
    - >-
      Routes: GET /api/candidates/{candidateId}/formation (formation.read: protégé, mentor, Talent Management; ETag = the
      candidate's version) returns the outcome: candidate status, step, current revision, every decision with its
      applicability and, once formed, the relationship with its formed agreement (content, hash, retained annex) and
      goals. POST /api/candidates/{candidateId}/draft/revisions/{revisionId}/formation-decisions (formation.decide:
      Talent Management) with body { outcome: Approved | Rejected, contentHash } and If-Match answers 200 with the outcome
      and the new ETag. Problems reused: "Version required" (428), "Candidate changed" (409), "Not possible in the
      candidate's current state" (409), "Revision superseded" (409), "Content mismatch" (422), "No employee profile yet"
      (409); new: "Agreement not accepted" (409). A revision that is not the candidate's is 404.
    - >-
      Decision rule chosen here: a decision of either outcome requires Step 3, because COMP-FORMATION owns Steps 3 and 4
      and ADR-005 records a rejection instead of an approval. A rejection leaves the candidate DRAFTING at Step 3;
      Talent Management may later approve the same revision while it stays current and accepted (ADR-005), or the
      participants revise; rejections may repeat, approvals cannot (one per candidate by index).
    - >-
      The approval transaction: version claim; re-check; the APPROVED decision; the relationship (DIGITAL, IN_PROGRESS,
      BLANK, N, duration and dates from the accepted terms); the formed agreement (the revision's content and hash, and
      admin_reference and admin_remarks as they stand); one goal per agreed goal (position from 1, agreed wording,
      INCOMPLETE); candidate FORMED; request disposition FORMED (left to this task by TASK-08); the audit entries; both
      participants' notifications. Audit (ADR-007): action FormationDecided with the candidate, the revision, its hash and
      outcome APPROVED or REJECTED on the FormationDecision (new value outcome) and, for an approval, on the Candidate
      (status DRAFTING to FORMED), the Relationship (its formation values, formedAgreementId, goalCount: the first entry of
      its history) and the MentorshipRequest (disposition OPEN to FORMED). Notifications: TASK-05's FormationDecided to
      both participants, ArrangeFirstSession or ReviseDraft.
    - >-
      For TASK-11: the relationship starts at version 1 (the column default). The formation view shows the current
      State, Status and IsActive but carries the candidate's version as its ETag, so the relationship view and edit
      command should carry the relationship's own version (ADR-005). The formation entry on the Relationship record holds
      its initial values; later AttributeChanged entries follow it.
    - >-
      For TASK-12: goals are created INCOMPLETE with positions from 1 and the agreed wording, bound to the relationship
      and its formed agreement. For tests, FormationApi (Outcome, Decisions, BothAcceptedAsync, BothAcceptAsync,
      DraftingWithAsync for a second approved mentor, DecideAsync, TryDecideAsync) forms relationships through the API;
      DraftApi.FormAsync still seeds a formed state directly for TASK-09's tests.
