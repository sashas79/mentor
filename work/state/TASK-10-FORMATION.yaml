  acceptance:
    # Several criteria are shared with other tasks; the notes give this task's share and the test that shows it.
    - criterion: AC-FR-030-01
      note: >-
        After both acceptances the candidate stays DRAFTING with no decision, relationship or goal until an approval
        (FormationPrerequisiteTests.Without_both_acceptances_of_the_current_revision_nothing_is_decided_or_formed,
        FormationTests); an approval naming a superseded revision is 409 "Revision superseded" and forms nothing
        (FormationPrerequisiteTests, FormationRulesTests).
    - criterion: AC-FR-030-02
      note: >-
        The decision records the administrator from the authenticated caller, never from the body (a body naming
        administratorEmployeeId is 400), shown as administratorEmployeeId; every FormationDecided entry names the
        administrator and their identity scheme (FormationTests, under Entra and the simulated scheme; FormationBodiesTests).
    - criterion: AC-FR-030-03
      note: >-
        A decision names the revision and the content hash reviewed: a superseded revision is 409, a hash other than the
        current revision's 422, a stale version 409 "Candidate changed", and a superseded rejection never counts
        (FormationPrerequisiteTests.A_stale_approval_or_one_of_superseded_content_forms_nothing, FormationTests rejection
        test). A superseded approval cannot exist: an approval forms the candidate in its own transaction, after which no
        revision is admitted.
    - criterion: AC-FR-031-01
      note: >-
        FormationRules re-checks under the version lock: mutual willingness column by column, the current revision and
        its hash, and both participants' acceptances of exactly that revision (FormationRulesTests). Before both
        acceptances a decision is 409 "Agreement not accepted"; after a withdrawal it is 409; a refusal persists no
        decision, audit entry or notification and leaves the version unchanged (FormationPrerequisiteTests).
    - criterion: AC-FR-031-02
      note: >-
        Formation proceeds only for the candidate's own current revision (another candidate's revision is 404) accepted
        by its own protégé and mentor, under its mutual willingness (FormationRulesTests, FormationPrerequisiteTests); the
        relationship takes the candidate's participants and refuses content naming other parties (FormationRecordsTests;
        TASK-02's foreign key binds the relationship to the candidate's participants). Legacy rows have no candidate, so
        no decision, formed agreement or goal can attach to them (TASK-02 constraints; legacy entry is TASK-13).
    - criterion: AC-FR-032-01
      note: >-
        The formed agreement copies the approved revision's content and hash byte for byte; no route changes it, the
        application's account has no UPDATE on formed_agreement, formation_decision or a goal's agreed wording, and the
        schema owner is refused by the insert-only triggers
        (FormationTests.Formation_evidence_stays_as_formed_whatever_later_changes_the_relationship). Earlier revisions and
        acceptances stay as evidence (FormationPrerequisiteTests).
    - criterion: AC-FR-032-02
      note: >-
        After formation the candidate admits no revision or decision (409) and its request pairs no other mentor (409
        "Request closed"); different terms take a new request, candidate, agreement, acceptances and approval, which form
        a second relationship with its own goals, and the first relationship's agreement and goals are unchanged
        (FormationTests.After_formation_different_terms_need_a_new_request_and_nothing_transfers).
    - criterion: AC-FR-032-03
      note: >-
        Before formation a replacement makes earlier acceptances and decisions inapplicable and needs both acceptances and
        an approval anew (FormationTests rejection test, FormationPrerequisiteTests; the reset itself is TASK-09); after
        formation a revision is refused and a change is a new relationship (FormationTests).
    - criterion: AC-FR-033-01
      note: >-
        Formation evidence (the decision, the formed agreement, the goals' wording, the audit entries) is in insert-only
        rows apart from the relationship's attributes; after State and IsActive change, the decision, formed agreement and
        goals read exactly as formed (FormationTests). Legacy records are TASK-13; no formation evidence can be attached to
        a row without a candidate.
    - criterion: AC-FR-070-01
      note: >-
        Approval and replacement both claim the candidate version first, so they run one after the other: taken at once,
        exactly one succeeds, either forming the relationship or replacing the revision and forming nothing
        (FormationPrerequisiteTests.An_approval_and_a_replacement_taken_at_once_end_with_exactly_one_taken).
    - criterion: AC-FR-070-02
      note: >-
        The approval is checked against the current revision and its own acceptances only: draft A's acceptances and
        rejection read Superseded and never count, content restored from draft A in a new revision still needs fresh
        acceptances, and the approval and the formed agreement name draft B (FormationPrerequisiteTests, FormationTests).
    - criterion: AC-E2E-01
      note: >-
        Formation share: through the API the protégé's request is paired, both record willingness, both accept the same
        revision and Talent Management approves; the relationship is formed In Progress, Status blank, IsActive N
