  notes:
    - >-
      Raising events (ADR-009): a command injects the scoped NotificationEvents (Mentor.Api.Notifications) and calls
      Raise(WorkflowNotifications.<Action>(record, ...)) before its SaveChangesAsync, passing the record as the command
      leaves it (status, mentor_response or withdrawn_by already set). Raise only adds rows to the scoped
      MentorDbContext, so the event commits or rolls back with the action and its audit entries. Per module: TASK-07
      MentorApplicationDecided; TASK-08 InvitationSent, MentorResponded, WillingnessRecorded(candidate, actor),
      CandidateWithdrawn; TASK-09 RevisionCreated(candidate, actor), AcceptanceRecorded(candidate, actor,
      otherParticipantHasAccepted); TASK-10 FormationDecided (both participants); TASK-12 GoalCompletionRequested,
      GoalCompletionDecided.
    - >-
      No event is addressed to Talent Management: administrators are known by app role, not by a record the
      application could address, so their pending work (applications to decide, drafts at step 3) is a query over the
      records, which TASK-07 and TASK-10 serve.
    - >-
      Migration MeetingsNotifications adds CANDIDATE_WITHDRAWN to the event-type check (ADR-015 names withdrawal, which
      ADR-009's list omits) and a check limiting required_action to the RequiredAction enumeration, stored as text like
      every other enumeration. A new next action is a new migration.
    - >-
      Agreement content (CONTRACT-AGREEMENT-CONTENT): TASK-09 writes the meeting interval and duration as positive whole
      numbers at terms.meetingIntervalWeeks and terms.approximateMinutesPerMeeting; AgreementMeetingTerms.Of(content)
      (Mentor.Core.Agreements, with the property names as constants) reads them, and a session copies them when it is
      recorded. A relationship without a formed agreement, a legacy one, has none.
    - >-
      Notifications:Delivery is None in appsettings.json: events are recorded without a delivery claim and the inbox
      lists them with delivery None. A prototype run sets Simulated. In tests, WorkflowApi starts the API with Simulated
      unless told otherwise.
    - >-
      Endpoint conventions used here: an unknown record answers 404 before any record check, a failed
      IsPermittedAsync answers Forbid (403), a creation answers 201 with Location through CreatedAtRoute, and a request
      body that must stay closed to free text carries [JsonUnmappedMemberHandling(Disallow)] so unknown members are
      refused with 400 rather than dropped.
    - >-
      Routes: GET and POST /api/candidates/{candidateId}/meetings (introductions; POST requires ACCEPTED or DRAFTING,
      else 409), GET and POST /api/relationships/{relationshipId}/meetings (the schedule and its sessions), GET and PUT
      /api/meetings/{meetingId} (time and arranged flag only), GET /api/notifications[?unread=true], GET
      /api/notifications/{id}, POST /api/notifications/{id}/read. TASK-08 and TASK-11 map /api/candidates/{id} and
      /api/relationships/{id} themselves; the meeting sub-routes do not collide.
    - >-
      Test support added for later tasks: WorkflowApi (the real API on a test database with the TestCallers, JSON calls
      as any profile) and CallerMentorship (a candidate, a formed relationship with meeting terms, or a legacy
      relationship between the Employee and Mentor callers).
