  notes:
    - >-
      Module layout follows TASK-06: endpoints in src/Mentor.Api/MentorRegistry/MentorRegistryEndpoints.cs
      (AddMentorRegistry/MapMentorRegistry on the "// Modules." lines of ApiHost.cs), the commands and queries in the
      scoped MentorApplications service, the views and the strict edit body in MentorProfileView.cs, and the pure rule
      MentorProfileDetails.TryCreate (biography required, 2000 characters; role/title 100; industry and mentoring
      experience 2000; blank means none) in Mentor.Core.MentorRegistry, unit-tested.
    - >-
      Routes: POST /api/mentor-applications (201, Location /api/mentor-profiles/{id}); GET
      /api/mentor-applications/pending (Talent Management, oldest first); POST /api/mentor-applications/{id}/approve and
      /decline (Talent Management, empty body); GET and PUT /api/mentor-profiles/me; GET /api/mentor-profiles/{id}; GET
      /api/mentors (every approved profile, by display name). Problem titles are constants on MentorRegistryEndpoints:
      "No employee profile yet" (409), "Already applied" (409), "No mentor application" (404), "Application already
      decided" (409). Every response is the one MentorProfileView, whose displayName and levelTitle come from the
      employee row, so a protégé sees who a discoverable mentor is without employee-profile.read.
    - >-
      The decision command (DecideAsync) is the pattern for a state transition that must be taken once: an explicit
      transaction (READ COMMITTED, ADR-013); the head read and the matrix check; then ExecuteUpdateAsync with the
      expected status in its WHERE, so two administrators deciding at once end with one decision and the other told 409
      (the second statement blocks on the row lock, re-evaluates, changes nothing); approval_decided_at set to
      DateTimeOffset.UtcNow, which Npgsql translates to now(), so the profile's decided_at, its updated_at (guard_update
      trigger), the audit entry's occurred_at and the notification's created_at all carry the transaction's server
      time; then the row re-read, AuditTrail.Append (MentorApplicationDecided on MENTOR_PROFILE, prior and new
      approvalStatus/approvalDecidedByEmployeeId/approvalDecidedAt, outcome APPROVED or DECLINED),
      NotificationEvents.Raise(WorkflowNotifications.MentorApplicationDecided), one SaveChangesAsync and the commit.
      No concurrency token was added to the model, so no migration.
    - >-
      One application per employee (unique index on employee_id, ADR-005), checked before the insert and caught on a
      racing insert. A declined applicant keeps the Applicant role, still reads and edits their profile, and cannot
      apply again: the architecture names no re-application or re-decision flow, and a decided row is never decided
      again (its decision evidence would be overwritten). If the product wants declined applicants to reapply, that is a
      new rule for the Work definition, not a module choice.
    - >-
      A caller without an employee record (never opened their profile) is refused with 409 rather than given a record
      here, as TASK-06 asked; the frontend (TASK-15) opens GET /api/employees/me right after sign-in, so the case is a
      direct API call. For the decision the same refusal protects AuditTrail.Append, which needs the administrator's
      employee record.
    - >-
      For TASK-08: candidate.create selects a discoverable mentor, so the command should require the mentor's
      MentorProfile.ApprovalStatus == Approved (ProtectedRecord.Of(profile).Discoverable says the same) and nothing
      about their relationship count (BR-002). For TASK-15: GET /api/mentor-profiles/me (200 or 404 "No mentor
      application") tells whether to offer the registration action; the session's roles tell applicant from mentor.
    - >-
      Test support added: tests/Mentor.Tests.Integration/MentorRegistry/MentorRegistryApi.cs (routes, a complete
      application body, profile-row lookups, MentorAsync to seed an approved or declined mentor who is not a caller).
      WorkflowApi's callers already give a pending Applicant and an approved Mentor.
