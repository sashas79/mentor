# Specification ingested under Engineering Harness control. Human-approved only once baselined.
schema_version: 1
specification:
  id: SPEC-MENTOR-APP
  title: Mentorship App — specification from DAR-MENT-BRS-0001 v0.3.0
  requirements:
    - id: REQ-FR-001
      statement: The application shall authenticate employees through the company Microsoft Entra ID implementation.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-002
      statement: The application shall use the authenticated Entra identity as the stable reference for each employee, independent of name or seniority level.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-003
      statement: The application shall distinguish the functions of protégé, mentor, and Talent Management administrator.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-004
      statement: The application shall authorise each protected action on the server, including approval and administrative edits.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-005
      statement: Employees shall be able to create and maintain their own application profile, without an MVP dependency on Profile Creator or the corporate Data Lake.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-006
      statement: Users shall not be able to change their authoritative Entra identity through profile editing.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-007
      statement: Any authenticated employee shall be permitted to apply to become a mentor.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-008
      statement: A mentor registration shall require Talent Management approval before that mentor is discoverable.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-009
      statement: The system shall make all registered and approved mentors available for discovery, regardless of the number of existing mentorship relationships.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-010
      statement: Mentors shall be able to maintain a concise biography and relevant professional attributes for protégé review.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-011
      statement: Mentor profiles shall support a role/title and separately captured industry experience and mentoring experience.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-012
      statement: The mentor discovery interface shall present available approved mentors together with their profiles.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-013
      statement: No inferred suitability score or automated AI ranking shall be a prerequisite for mentor discovery in MVP.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-014
      statement: An authenticated employee shall be able to submit a mentorship request containing the motivation for seeking mentorship.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-015
      statement: A mentorship request shall capture the prospective protégé's technical and career development goals.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-016
      statement: A mentorship request shall capture what the protégé expects beyond technical skills.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-017
      statement: The application shall retain the original mentorship request distinctly from any subsequent approved agreement.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-018
      statement: A protégé shall be able to express interest in a discoverable mentor and arrange an introductory conversation.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-019
      statement: The system shall support a recorded positive or negative response from the prospective mentor to a proposed introduction or pairing.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-020
      statement: The system shall record an independent acceptance decision from each participant before a mentorship is formed.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-021
      statement: Unsuccessful or withdrawn prospective pairings shall not be represented as active mentorship relationships.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-022
      statement: Following mutual willingness to proceed, the identified mentor and protégé shall be able to prepare and review a digital agreement draft containing the substantive content of the existing mentorship agreement. Prior to formation, draft replacement follows FR-067–FR-070; it is not an amendment to a formed agreement.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-023
      statement: The agreement shall support the duration categories 6 months, 12 months, and 12+ months.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-024
      statement: Agreement start and end dates shall each be optional.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-025
      statement: The agreement shall capture its meeting frequency, approximate meeting duration, out-of-meeting contact expectations, missed-meeting arrangements, and agreed review date, where supplied.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-026
      statement: The agreement shall capture defined development goals, potential barriers, contingency plans, mentor/protégé responsibilities and the original commitments on confidentiality and constructive feedback.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-027
      statement: Each identified participant shall independently accept the same current agreement draft content electronically; earlier acceptances of superseded drafts do not count towards formation.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-028
      statement: The application shall retain the actual actor, timestamp, exact content identity and current applicability of every draft acceptance, including acceptances that are invalidated by a subsequent substantive revision.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-029
      statement: From the first participant acceptance, that exact accepted draft content shall be preserved unchanged. A permitted substantive pre-formation revision creates a replacement draft and resets its workflow under FR-067; it never edits or erases the previously accepted content. The formed agreement remains immutable.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-030
      statement: A Talent Management administrator shall approve formation only after the identified mentor and protégé have accepted the same current draft and the required pairing decisions are valid; any superseded draft's acceptance or approval decision is inapplicable.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-031
      statement: An In Progress mentorship shall first be formed only when current mutual pairing acceptance, both participants' valid acceptances of identical current agreement content and Talent Management approval are all present. A draft revision shall not allow stale decisions to satisfy these prerequisites.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-032
      statement: After relationship formation, different agreed terms, goals or mentor require a separate mentorship request, agreement, acceptance and approval process. Before formation, revisions to the same parties' agreement draft follow FR-067–FR-070; a change in mentor/protégé identity also requires new matching and mutual acceptance for the new parties.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-033
      statement: The application shall retain auditable pairing decisions, draft versions/snapshots, participant acceptances, invalidation events and formation approvals independently from mutable relationship administration fields; superseded decisions remain historical evidence, not current approvals.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-034
      statement: The application shall represent development goals individually so that their progress can be monitored separately.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-035
      statement: The protégé shall be able to submit progress information against an agreed development goal.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-036
      statement: The protégé shall be able to request formal completion of a development goal.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-037
      statement: The mentor shall be responsible for approving the completion of a development goal.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-039
      statement: Talent Management administrators shall not be approvers of progress submissions or goal completion.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-040
      statement: The administrator may view development goals and their progress for relationship administration and reporting.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-043
      statement: The application shall store State, Status and IsActive as distinct relationship attributes.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-044
      statement: State shall allow exactly In Progress, On hold and Complete as business values.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-045
      statement: Status shall allow Needs reassigning or blank as business values. This is a register/administration field and does not imply an in-app mentor-reassignment workflow.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-046
      statement: IsActive shall allow Y and N as business values.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-047
      statement: For an already formed mentorship relationship, Talent Management administrators shall be able to change State from any permitted value to any other permitted value. These edits shall not bypass the initial formation prerequisites.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-048
      statement: Talent Management administrators shall be able to change Status independently of State.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-049
      statement: Talent Management administrators shall be able to override IsActive independently of both State and Status.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-050
      statement: Any default or automatically suggested IsActive value shall not prevent or later silently overwrite an administrator's explicit choice.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-051
      statement: The application shall retain an audit history of changes to State, Status and IsActive.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-054
      statement: Mentorship relationship records shall support more than one relationship involving the same mentor or protégé over time.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-055
      statement: The agreement shall record planned meeting frequency and approximate meeting duration.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-056
      statement: The application shall support representation of proposed introductory meetings and planned recurring mentorship sessions in the prototype.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-057
      statement: The application shall support notifications or demonstrable notification events for material workflow actions.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-058
      statement: Production-grade live calendar synchronisation, availability search and rescheduling exception management shall not be dependencies of the first prototype.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-059
      statement: The system shall not require storing private meeting discussion content to record a meeting or update a development goal.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-060
      statement: Talent Management shall be able to view a mentorship relationship register containing mentor, protégé, levels, State, Status, IsActive, dates and duration where available.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-061
      statement: The authoritative application records shall reside in a structured data store; the spreadsheet shall be a reporting/export view rather than an independently edited authoritative store.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-062
      statement: The system shall preserve unknown or absent historic dates rather than fabricating dates during manual legacy data entry.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-063
      statement: Initial legacy records may be entered manually through controlled database entry or an existing administrative mechanism, by a person authorised for that work; validation, identity resolution, provenance and accountability shall be preserved without an automated importer or new migration interface.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-064
      statement: The application shall maintain separately identifiable employee identities, requests, accepted agreements, formed relationships, goals, progress entries and approvals.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-065
      statement: Business-critical actions shall retain sufficient identity, timestamp and outcome information to be auditable.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-066
      statement: The application shall allow Talent Management to retrieve structured goals and progress without access to private meeting discussion content.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-067
      statement: If the substantive content or terms of an agreement draft change after either party accepts it and before the mentorship is formed, the system shall create a replacement draft and reset the agreement-draft workflow to Step 1 (draft preparation). All previous draft acceptance states, statuses and draft-specific decisions become inapplicable; both parties shall accept the replacement draft anew before administrator formation approval.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-068
      statement: A change after draft acceptance may avoid workflow reset only if it is demonstrably administrative or non-substantive, does not change meaning, obligations, rights, parties, goals or terms, and is explicitly permitted and recorded by the application. Such a change must not overwrite the exact content snapshot already accepted; its record must distinguish the allowed change from accepted content. All other changes must follow FR-067 or be rejected.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-069
      statement: The system shall preserve superseded draft content, previous acceptances and draft-specific decisions as historical audit evidence, identifying the actor, time, revision and invalidation outcome; superseded evidence shall not count toward formation.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-070
      statement: The system shall validate draft currency and applicability of each prerequisite at the moment of formation, preventing an administrator approval based on superseded content or decisions; following a substantive draft replacement, both fresh participant acceptances and a new applicable formation approval are required.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-001
      statement: Any Entra-authenticated employee may apply to mentor; only Talent Management-approved mentors are discoverable.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-002
      statement: Approved mentors have no numerical limit on simultaneous relationships.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-003
      statement: An In Progress mentorship is first formed only after mutual acceptance, acceptance of the agreement by both participants and administrator approval.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-004
      statement: The accepted content of each draft snapshot is preserved unchanged. A substantive pre-formation change creates a replacement draft, invalidates all prior draft-specific acceptance states/statuses/decisions and restarts Step 1; both parties accept the replacement. Once a relationship is formed, its agreement content, parties, terms and goals are fixed and different terms or mentor require a new relationship.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-005
      statement: The protégé may submit ordinary progress without approval and request formal goal completion. The identified mentor alone approves or rejects completion; a pending or rejected request does not mark the goal complete. Agreed goal wording is immutable after formation. No rejection-reason requirement, resubmission loop, escalation or goal-amendment workflow is included in MVP.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-006
      statement: For formed operational relationships, State is In Progress, On hold or Complete; Talent Management may move between these in either direction. Drafts and unformed candidates have no operational relationship State. Legacy unresolved source values remain separate review exceptions.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-007
      statement: Status values are Needs reassigning and blank. Talent Management edits Status independently on formed relationships; the label does not trigger reassignment.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-008
      statement: IsActive is Y or N for formed operational relationships and is independently editable by Talent Management, including unusual combinations. The initial formation-time value or choosing actor remains to be decided under OPEN-002; historical 'Active' text cannot be mapped automatically.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-009
      statement: The application does not reject unusual State/Status/IsActive combinations for formed relationships or silently overwrite explicit administrator choices; this rule does not authorise forming relationships without all prerequisites.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-010
      statement: Duration categories are 6 months, 12 months and 12+ months. A 12+ duration may be open ended.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-011
      statement: StartDate and EndDate are optional for all duration categories.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-012
      statement: Separate digital agreement acceptances replace handwritten signatures.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-013
      statement: Administrators may view structured goals and progress but not private meeting discussions.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-015
      statement: Participants maintain their profiles in the app; MVP does not depend on the Data Lake or another employee-profile integration.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-016
      statement: Historical records are entered manually using controlled entry, identity resolution and valid references; source values/provenance, missing dates and actor accountability are retained. Legacy records are not represented as digitally accepted/approved; unresolved source rows remain review exceptions. No automated importer or new entry UI is mandated.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-017
      statement: Agreements capture the source meeting cadence/duration, cancellation, missed-meeting, next meeting, between-meeting contact, and three-to-six-month review commitments. These are participant commitments only; no automatic policing, reminders, overdue/closure rules or enforcement workflow are in MVP.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-018
      statement: The original agreement binds participants to meeting confidentiality; MVP does not store private discussion notes. Structured goals and progress remain visible to permitted roles.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-019
      statement: Only currently applicable acceptances of the same current draft by the identified mentor and protégé count. Substantive draft replacement invalidates all earlier draft-specific acceptance states, statuses and decisions and starts Step 1 again; historical records are retained but have no approval effect.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-020
      statement: An explicitly permitted and recorded administrative or non-substantive change that does not affect draft meaning, rights, obligations, parties, goals or terms does not restart the draft workflow. It must not overwrite accepted snapshot content. No unrestricted edit permission is inferred; absent an approved permitted-change rule the change cannot use this exception.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-021
      statement: Agreement draft lifecycle values/decisions are separate from candidate pairing decisions and from formed relationship State/Status/IsActive. Changing an identified party also invalidates that party's earlier pairing and agreement acceptances and requires renewed pairing decisions before formation.
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-DR-001
      statement: "Employee: the application shall maintain the Entra object identifier for digitally authenticated employees; display name, optional level/title, owner; and historical identity-resolution evidence where relevant. Entra is the authority for authenticating current employees; historical names alone are not reliable identifiers and cannot generate fictitious identities."
      source_refs:
        - Mentorship_App_BRS
        - ConceptualDiagram
    - id: REQ-DR-002
      statement: "MentorProfile: the application shall maintain employee, biography, role/title, industry experience, mentoring experience and approval. Only approved mentors are discoverable; no numeric capacity cap."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-DR-003
      statement: "MentorshipRequest: the application shall maintain protégé, motivation, technical/career goals, nontechnical expectations, date and disposition. The request is different from the eventual agreement."
      source_refs:
        - Mentorship_App_BRS
        - ConceptualDiagram
    - id: REQ-DR-004
      statement: "MentorSelection: the application shall maintain request, candidate mentor, invitation and response, and dates. A declined mentor does not create a formed relationship."
      source_refs:
        - Mentorship_App_BRS
        - ConceptualDiagram
    - id: REQ-DR-005
      statement: "MentorshipRelationship: the application shall maintain participants, State, Status, IsActive, duration, optional dates, history and digital-versus-legacy provenance. Digitally formed only after all prerequisites; accepted history distinct from manually entered source data. Independent operational attributes; unresolved historical values do not become invented facts."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-DR-006
      statement: "MentorshipAgreement: preserve each current and superseded draft's complete substantive content, terms, goals, participants and stable content identity, and the formed immutable agreement snapshot. Pre-formation replacements never mutate or erase a previously accepted content snapshot. Conceptual entity, not a table prescription."
      source_refs:
        - Mentorship_App_BRS
        - ConceptualDiagram
    - id: REQ-DR-007
      statement: "AgreementAcceptance: retain exact draft/content identity, actual participant, time, current applicability and invalidation/supersession association. Both required current acceptances reference identical current content; historical superseded or legacy acceptance evidence cannot be fabricated or treated as current. Conceptual entity, not a table prescription."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-DR-008
      statement: "FormationApproval: associate the approving Talent Management administrator, actual action time, identified candidate and current draft content with the formation decision. Superseded draft-specific decisions cannot count; historical legacy relationships must not gain fictitious digital approvals. Conceptual entity, not a table prescription."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-DR-009
      statement: "DevelopmentGoal: the application shall maintain relationship/agreement goal reference, agreed description and completion status. Agreed goal text is fixed; status is updated separately from agreement content."
      source_refs:
        - Mentorship_App_BRS
        - ConceptualDiagram
    - id: REQ-DR-010
      statement: "GoalProgress: the application shall maintain goal, protégé, dated progress update and optional completion request. Submitting progress does not mean approved completion."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-DR-011
      statement: "GoalApproval: the application shall maintain goal completion request, mentor, approved/rejected decision and actual date/time. Pending requests are not approvals; rejection leaves goal incomplete; no rejection-reason or retry subsystem mandated."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-DR-013
      statement: "MeetingSchedule: the application shall maintain relationship, proposed/scheduled session time if available, and agreed frequency/duration. No private notes or live calendar dependency."
      source_refs:
        - Mentorship_App_BRS
        - ConceptualDiagram
    - id: REQ-DR-014
      statement: "AdministrationAudit: preserve actors, actions, affected records, previous/current values, real timestamps, draft revision/supersession/invalidation events, applicable decision context, and manual-entry source references. Actual application actions must be distinguishable from legacy-source claims. Conceptual entity, not a table prescription."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-DR-015
      statement: "AgreementDraftRevision: conceptually identify draft revision, parent/superseded draft, whether each change is substantive or an explicitly authorised non-substantive change, actor, time, changed content identity and resulting workflow reset or permitted exception. Previously accepted copies remain unchanged. Conceptual entity, not a required extra database table."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-NFR-001
      statement: "Security: in production, authenticate through Entra and authorise protected operations at the server/API. An explicitly simulated prototype identity does not satisfy production authentication acceptance; server authorisation still applies."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-NFR-002
      statement: "Privacy: do not capture private meeting discussion notes in MVP, including in administrator screens, exports, APIs or logs."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-NFR-003
      statement: "Data integrity: maintain valid references across employee identities, agreements, requests, goals, relationships and recorded approvals; unresolved legacy identities cannot be silently replaced with guesses."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-NFR-004
      statement: "Auditability: retain true actor, action timestamp, relevant values and outcome for actual acceptances, approvals, goal decisions, administration and manual legacy entry; never invent historical event timestamps."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-NFR-005
      statement: "Agreement integrity: preserve the exact accepted content snapshot unchanged; ensure substantive pre-formation replacement invalidates old draft acceptance applicability without deleting evidence; ensure formed agreement content cannot be substantively amended. Technical version/hash/signature mechanisms are architecture decisions."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-NFR-006
      statement: "User experience: deliver understandable, role-appropriate self-service screens for protégés, mentors and administrators in the separately delivered React frontend, backed by server-enforced permissions."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-NFR-007
      statement: "Availability/recovery: production operation requires an appropriate recoverability decision for the authoritative store; no quantitative target is specified by this BRS."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-NFR-008
      statement: "Operational support: define production ownership and controlled operator/data access before production; no new admin module or configuration workflow is mandated."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-NFR-009
      statement: "Data protection: limit personally attributable development information to permitted roles and protect it in storage/transit. Do not expose private meeting discussions through records, APIs, exports or logs."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-NFR-010
      statement: "Prototype portability: prototype core flows shall function without live calendar, Data Lake, AI inference, live notification transport or completed Entra configuration where identity simulation is expressly identified."
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-022
      statement: Only a Talent Management administrator is authorised to validate and manually enter historical mentorship relationships. (Resolves OPEN-001; decision by product_domain authority, 27 Oct 2026.)
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-FR-071
      statement: When a mentorship relationship is formed, its IsActive value shall default to N; no actor supplies the initial value. IsActive is an enumerated value restricted to Y and N. (Resolves OPEN-002; decision by product_domain authority, 27 Oct 2026.)
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-BR-023
      statement: Every administrative or non-substantive draft change, as defined by FR-068, may bypass the draft workflow reset, and only a Talent Management administrator may perform such a change. (Resolves OPEN-003; decision by product_domain authority, 27 Oct 2026.)
      source_refs:
        - Mentorship_App_BRS
    - id: REQ-DR-016
      statement: Historic people absent from the Entra directory shall be retained as source rows marked as review exceptions; an Entra identity shall never be invented for them. (Resolves OPEN-004; decision by product_domain authority, 27 Oct 2026.)
      source_refs:
        - Mentorship_App_BRS
  acceptance_criteria:
    - id: AC-FR-001-01
      requirement_id: REQ-FR-001
      statement: An employee with a permitted Entra identity can sign in without a separate application password.
    - id: AC-FR-001-02
      requirement_id: REQ-FR-001
      statement: Unauthenticated requests to protected resources are rejected.
    - id: AC-FR-001-03
      requirement_id: REQ-FR-001
      statement: Production identity acceptance requires Microsoft Entra ID. A labelled simulated identity in the prototype is not treated as a successful production Entra integration test.
    - id: AC-FR-002-01
      requirement_id: REQ-FR-002
      statement: Two employees with the same name can have distinct profiles.
    - id: AC-FR-002-02
      requirement_id: REQ-FR-002
      statement: Changing a profile display name does not change the employee association on existing records.
    - id: AC-FR-003-01
      requirement_id: REQ-FR-003
      statement: Access and available actions differ by assigned role.
    - id: AC-FR-003-02
      requirement_id: REQ-FR-003
      statement: An employee may perform both mentor and protégé functions.
    - id: AC-FR-004-01
      requirement_id: REQ-FR-004
      statement: An unauthorised user cannot approve a mentor or edit another employee's relationship by invoking an API directly.
    - id: AC-FR-004-02
      requirement_id: REQ-FR-004
      statement: Authorisation applies regardless of the interface used, including a prototype that explicitly simulates user identities.
    - id: AC-FR-005-01
      requirement_id: REQ-FR-005
      statement: An authenticated employee can save their own profile details.
    - id: AC-FR-005-02
      requirement_id: REQ-FR-005
      statement: The profile remains available when no external employee-profile integration is configured.
    - id: AC-FR-006-01
      requirement_id: REQ-FR-006
      statement: Changing editable profile details does not change the linked Entra employee identity.
    - id: AC-FR-007-01
      requirement_id: REQ-FR-007
      statement: The mentor registration action is available to an authenticated employee who has not previously registered as a mentor.
    - id: AC-FR-008-01
      requirement_id: REQ-FR-008
      statement: A pending mentor does not appear in the protégé's mentor list.
    - id: AC-FR-008-02
      requirement_id: REQ-FR-008
      statement: Approval causes the mentor to become eligible for discovery.
    - id: AC-FR-009-01
      requirement_id: REQ-FR-009
      statement: An approved mentor is included even if already mentoring several people.
    - id: AC-FR-009-02
      requirement_id: REQ-FR-009
      statement: No numerical mentor capacity limit prevents new requests.
    - id: AC-FR-009-03
      requirement_id: REQ-FR-009
      statement: No unapproved mentor availability flag or relationship count silently removes an approved registered mentor from the discovery list (DEC-006).
    - id: AC-FR-010-01
      requirement_id: REQ-FR-010
      statement: A mentor can edit a brief biography and recorded experience attributes.
    - id: AC-FR-010-02
      requirement_id: REQ-FR-010
      statement: A protégé can read those attributes for discoverable mentors.
    - id: AC-FR-011-01
      requirement_id: REQ-FR-011
      statement: Profile display and discovery can distinguish job title, industry experience and mentoring experience.
    - id: AC-FR-012-01
      requirement_id: REQ-FR-012
      statement: A protégé can browse multiple approved mentors and open their summaries.
    - id: AC-FR-013-01
      requirement_id: REQ-FR-013
      statement: The MVP mentor list functions without an AI inference service.
    - id: AC-FR-014-01
      requirement_id: REQ-FR-014
      statement: The request records the stated motivation and the submitting protégé identity.
    - id: AC-FR-015-01
      requirement_id: REQ-FR-015
      statement: The protégé can submit technical and career aspirations as part of the request.
    - id: AC-FR-016-01
      requirement_id: REQ-FR-016
      statement: The request stores the nontechnical expectations separately from technical and career goals.
    - id: AC-FR-017-01
      requirement_id: REQ-FR-017
      statement: A request remains identifiable before or after a mentorship agreement is formed.
    - id: AC-FR-018-01
      requirement_id: REQ-FR-018
      statement: The selected mentor and invitation/request can be associated with the protégé's request.
    - id: AC-FR-018-02
      requirement_id: REQ-FR-018
      statement: A proposed introduction remains associated with the candidate and can be marked arranged outside the application; no calendar API is required.
    - id: AC-FR-019-01
      requirement_id: REQ-FR-019
      statement: A mentor can accept or decline a pending invitation.
    - id: AC-FR-019-02
      requirement_id: REQ-FR-019
      statement: A declined invitation is not interpreted as mutual acceptance.
    - id: AC-FR-020-01
      requirement_id: REQ-FR-020
      statement: Acceptance by only one person does not satisfy mutual acceptance.
    - id: AC-FR-020-02
      requirement_id: REQ-FR-020
      statement: The system identifies the accepting mentor and protégé independently.
    - id: AC-FR-021-01
      requirement_id: REQ-FR-021
      statement: A failed pairing does not create an In Progress relationship.
    - id: AC-FR-021-02
      requirement_id: REQ-FR-021
      statement: A withdrawn pairing retains its withdrawn disposition and does not acquire a formed relationship or reuse its prior draft approval decisions.
    - id: AC-FR-022-01
      requirement_id: REQ-FR-022
      statement: "The digital agreement reproduces the original agreement's substantive commitments: voluntary partnership; identified mentor and protégé; term/duration and review expectations; meetings/contact; development activities and SMART goal guidance; barriers and contingencies; respective roles; confidentiality; and honest constructive feedback/open reception of feedback."
    - id: AC-FR-022-02
      requirement_id: REQ-FR-022
      statement: The complete content presented to each signatory is available for review before acceptance, including fixed policy text as well as any entered values.
    - id: AC-FR-023-01
      requirement_id: REQ-FR-023
      statement: Each of the three duration categories can be saved.
    - id: AC-FR-023-02
      requirement_id: REQ-FR-023
      statement: 12+ does not require a fixed end date.
    - id: AC-FR-024-01
      requirement_id: REQ-FR-024
      statement: An agreement can be stored with either or both dates empty.
    - id: AC-FR-024-02
      requirement_id: REQ-FR-024
      statement: Where entered, each date remains available for display and reporting.
    - id: AC-FR-025-01
      requirement_id: REQ-FR-025
      statement: The agreement represents the intended meeting interval in weeks, approximate minutes per meeting, limits on between-meeting telephone/email contact using the source's weeks/days wording, arrangements when either party cannot attend, and the date for review where supplied.
    - id: AC-FR-025-02
      requirement_id: REQ-FR-025
      statement: The accepted terms communicate the original commitments to avoid cancelling except where unavoidable, agree the next meeting date at each meeting, and evaluate the relationship every three to six months. These are participant commitments, not automated enforcement or reminders.
    - id: AC-FR-026-01
      requirement_id: REQ-FR-026
      statement: Individual goals, guidance to form goals using SMART principles, barriers, contingency plans and the distinct agreed duties of mentor and protégé are included in the same accepted content.
    - id: AC-FR-026-02
      requirement_id: REQ-FR-026
      statement: The accepted agreement includes confidentiality of meeting discussions, mentor honesty and constructive feedback, protégé openness to feedback, and the original expectation of concluding the relationship by amicable agreement once useful development is achieved. These commitments do not create a discussion-notes store or automatic completion workflow.
    - id: AC-FR-027-01
      requirement_id: REQ-FR-027
      statement: In production, each acceptance is attributed to the distinct Entra-identified participant. A prototype may demonstrate separate acceptances with explicitly simulated identities, but this does not satisfy production identity acceptance.
    - id: AC-FR-027-02
      requirement_id: REQ-FR-027
      statement: Neither participant's acceptance is inferred from the other's action.
    - id: AC-FR-027-03
      requirement_id: REQ-FR-027
      statement: Both applicable acceptances identify the same current agreement draft content; an earlier acceptance of superseded content cannot be combined with a later one.
    - id: AC-FR-027-04
      requirement_id: REQ-FR-027
      statement: After replacement, both participants must accept the replacement draft; neither prior acceptance fulfils the requirement.
    - id: AC-FR-028-01
      requirement_id: REQ-FR-028
      statement: An administrator can verify distinct current and superseded draft acceptances, each actual actor and timestamp, exact content reference and applicability.
    - id: AC-FR-028-02
      requirement_id: REQ-FR-028
      statement: The system distinguishes retained historical acceptance evidence from current applicable acceptance for the active draft.
    - id: AC-FR-029-01
      requirement_id: REQ-FR-029
      statement: An attempt to modify an already accepted content snapshot is rejected or leaves that snapshot unchanged; a substantive pre-formation replacement is a new draft, not an edit to the accepted snapshot.
    - id: AC-FR-029-02
      requirement_id: REQ-FR-029
      statement: An acceptance of different content cannot be combined with the first acceptance to form a relationship.
    - id: AC-FR-029-03
      requirement_id: REQ-FR-029
      statement: A pre-formation replacement draft makes earlier acceptances inapplicable, returns to Step 1 and requires fresh acceptance from both participants. This behaviour is included in MVP.
    - id: AC-FR-029-04
      requirement_id: REQ-FR-029
      statement: A substantive change after the first acceptance leaves the prior accepted snapshot untouched, creates a distinct replacement draft and resets the workflow to Step 1.
    - id: AC-FR-030-01
      requirement_id: REQ-FR-030
      statement: Neither two participant acceptances without administrator approval nor approval against superseded content can create an In Progress mentorship.
    - id: AC-FR-030-02
      requirement_id: REQ-FR-030
      statement: The approval identifies the approving administrator.
    - id: AC-FR-030-03
      requirement_id: REQ-FR-030
      statement: An administrator cannot form a relationship from superseded draft content or a superseded formation decision.
    - id: AC-FR-031-01
      requirement_id: REQ-FR-031
      statement: Omitting any current prerequisite, or relying on an invalidated draft acceptance or decision, prevents initial relationship formation.
    - id: AC-FR-031-02
      requirement_id: REQ-FR-031
      statement: Only all three current prerequisites for the same candidate, same draft and same parties permit formation; historic legacy rows do not assert these events.
    - id: AC-FR-032-01
      requirement_id: REQ-FR-032
      statement: The formed agreement and its record remain immutable; old draft snapshots and their event evidence also remain unchanged.
    - id: AC-FR-032-02
      requirement_id: REQ-FR-032
      statement: After formation, a change of mentor or agreed terms uses a separate request, agreement, acceptances and formation approval, with no transfer of goals.
    - id: AC-FR-032-03
      requirement_id: REQ-FR-032
      statement: Before formation, a substantive change between the same identified participants restarts the draft workflow; after formation, it cannot change the formed agreement and requires a new relationship.
    - id: AC-FR-033-01
      requirement_id: REQ-FR-033
      statement: Later changes to State, Status or IsActive do not erase original formation evidence. Historical manually entered records remain identified as legacy and have no fabricated digital formation evidence.
    - id: AC-FR-034-01
      requirement_id: REQ-FR-034
      statement: Each goal can be identified and shown with its own progress state.
    - id: AC-FR-035-01
      requirement_id: REQ-FR-035
      statement: A protégé can submit a dated progress update against a goal in their relationship.
    - id: AC-FR-036-01
      requirement_id: REQ-FR-036
      statement: A submitted completion request is visibly pending until the mentor decides, without changing the goal to mentor-approved complete.
    - id: AC-FR-037-01
      requirement_id: REQ-FR-037
      statement: A protégé completion request remains unconfirmed until the mentor approves it.
    - id: AC-FR-037-02
      requirement_id: REQ-FR-037
      statement: The mentor identity, actual decision (approved or rejected) and timestamp are retained. A rejection leaves the agreed goal incomplete; no rejection-reason field or resubmission workflow is assumed (DEC-008).
    - id: AC-FR-039-01
      requirement_id: REQ-FR-039
      statement: Goal completion approval is possible only through the identified mentor action without any administrator approval step.
    - id: AC-FR-040-01
      requirement_id: REQ-FR-040
      statement: A Talent Management administrator can view the goal and structured progress information.
    - id: AC-FR-043-01
      requirement_id: REQ-FR-043
      statement: Changing one attribute does not require a change to either of the other two.
    - id: AC-FR-044-01
      requirement_id: REQ-FR-044
      statement: Each named State can be saved by an authorised administrator for a formed operational relationship. Unresolved historical State is held as unknown during manual review; it is not a fourth State value.
    - id: AC-FR-045-01
      requirement_id: REQ-FR-045
      statement: An administrator can set or clear Needs reassigning for any State without starting a reassignment workflow.
    - id: AC-FR-046-01
      requirement_id: REQ-FR-046
      statement: An administrator can select Y or N for any State and Status combination on a formed relationship. An unverified historical Active cell does not automatically supply IsActive (OPEN-002 governs the initial formed-relationship value).
    - id: AC-FR-047-01
      requirement_id: REQ-FR-047
      statement: Complete can be changed to In Progress or On hold.
    - id: AC-FR-047-02
      requirement_id: REQ-FR-047
      statement: In Progress can be changed directly to Complete; no intermediate state is required. An unapproved candidate cannot be activated by an administrator State edit.
    - id: AC-FR-048-01
      requirement_id: REQ-FR-048
      statement: Needs reassigning can be set or cleared while State remains unchanged.
    - id: AC-FR-049-01
      requirement_id: REQ-FR-049
      statement: Complete with IsActive=Y can be saved.
    - id: AC-FR-049-02
      requirement_id: REQ-FR-049
      statement: In Progress with IsActive=N can be saved.
    - id: AC-FR-050-01
      requirement_id: REQ-FR-050
      statement: An explicit administrator override remains effective following unrelated state or status changes.
    - id: AC-FR-051-01
      requirement_id: REQ-FR-051
      statement: Each recorded change identifies prior value, new value, acting administrator and timestamp.
    - id: AC-FR-054-01
      requirement_id: REQ-FR-054
      statement: Two historical relationships involving the same person remain separately identifiable.
    - id: AC-FR-055-01
      requirement_id: REQ-FR-055
      statement: Agreed meeting frequency and duration are viewable by both participants.
    - id: AC-FR-056-01
      requirement_id: REQ-FR-056
      statement: A prototype user can view proposed or scheduled sessions for the example relationship.
    - id: AC-FR-057-01
      requirement_id: REQ-FR-057
      statement: For invitations, mentor responses, mutual-agreement actions, participant agreement acceptance, administrator approval and mentor goal-completion decisions, the prototype can identify the material action, intended recipient/role and required next action where applicable.
    - id: AC-FR-057-02
      requirement_id: REQ-FR-057
      statement: The outcome is demonstrable in the prototype through an in-app notice, event display or explicitly simulated delivery. No delivery channel, queue, reminder schedule or production notification service is implied.
    - id: AC-FR-057-03
      requirement_id: REQ-FR-057
      statement: Notification/event visibility is restricted to the intended authorised recipient; another unrelated employee cannot retrieve pending-action details.
    - id: AC-FR-058-01
      requirement_id: REQ-FR-058
      statement: The prototype can complete its demonstration without live calendar API access.
    - id: AC-FR-059-01
      requirement_id: REQ-FR-059
      statement: A meeting record can be created without private discussion notes.
    - id: AC-FR-060-01
      requirement_id: REQ-FR-060
      statement: The authorised register/export displays the available spreadsheet-compatible fields without converting source unknowns to invented values; historical provenance and unresolved mappings are distinguishable from digitally formed data.
    - id: AC-FR-060-02
      requirement_id: REQ-FR-060
      statement: An unauthorised employee cannot access the relationship register or its export through the user interface or API.
    - id: AC-FR-061-01
      requirement_id: REQ-FR-061
      statement: The reporting extract can be reconstructed from stored application records without treating the spreadsheet as a second authoritative source or requiring automatic synchronisation.
    - id: AC-FR-062-01
      requirement_id: REQ-FR-062
      statement: A legacy record with an unknown start or end date is retained without a guessed date.
    - id: AC-FR-062-02
      requirement_id: REQ-FR-062
      statement: Non-date source text such as "ongoing" remains traceable as source evidence, not a fabricated date; ambiguous textual dates are not interpreted without an explicit mapping decision.
    - id: AC-FR-063-01
      requirement_id: REQ-FR-063
      statement: The MVP does not depend on an automated legacy importer, new entry screen or migration subsystem.
    - id: AC-FR-063-02
      requirement_id: REQ-FR-063
      statement: Where a record is admitted as authoritative, all applicable available historical values are retained without distortion, its participants are resolved to correct employee identities, references are valid, and the original source row/file and manual-entry actor/action time are traceable.
    - id: AC-FR-063-03
      requirement_id: REQ-FR-063
      statement: Records with unresolved identities or unsupported State/Status/IsActive interpretation remain identifiable as review exceptions instead of being assigned guessed identities/values. The original spreadsheet remains available as provenance; no new staging application is prescribed.
    - id: AC-FR-063-04
      requirement_id: REQ-FR-063
      statement: Manual history does not generate invented relationship-formation approvals, digital acceptances or historical action timestamps. Authority to perform entry is pending OPEN-001.
    - id: AC-FR-064-01
      requirement_id: REQ-FR-064
      statement: A single mutable spreadsheet-style row is not the only retained record of digitally formed relationships; manually entered historical records carry a separate provenance indicator and do not imply missing digital lifecycle objects exist.
    - id: AC-FR-065-01
      requirement_id: REQ-FR-065
      statement: Actual mutual acceptance, agreement acceptance, mentor goal-completion decision, administrator formation approval, administrative overrides and accountable manual historical entry are traceable where they occurred; legacy records are not backfilled with fictitious events.
    - id: AC-FR-066-01
      requirement_id: REQ-FR-066
      statement: An administrator can see goal completion status while private discussion content is not available through reports or APIs.
    - id: AC-FR-067-01
      requirement_id: REQ-FR-067
      statement: After either party accepts draft A, editing a substantive term produces draft B with Step 1 status and no applicable participant acceptances or draft-specific approval decisions.
    - id: AC-FR-067-02
      requirement_id: REQ-FR-067
      statement: Both participants independently accept draft B before formation may be approved.
    - id: AC-FR-067-03
      requirement_id: REQ-FR-067
      statement: Prior draft A acceptance status and decisions remain in audit history but are not effective for draft B.
    - id: AC-FR-068-01
      requirement_id: REQ-FR-068
      statement: A permitted, audited, non-substantive change that preserves the meaning and commitments and does not overwrite the accepted content snapshot does not reset the draft workflow.
    - id: AC-FR-068-02
      requirement_id: REQ-FR-068
      statement: An unspecified/unpermitted edit is never silently classified as non-substantive; it is blocked or treated as substantive and triggers reset.
    - id: AC-FR-068-03
      requirement_id: REQ-FR-068
      statement: Any change to obligations, rights, parties, goals or terms cannot use the non-substantive exception.
    - id: AC-FR-069-01
      requirement_id: REQ-FR-069
      statement: For every supersession, current and prior content can be distinguished; actual actor, time, reset outcome and prior decisions can be audited without making old approvals effective.
    - id: AC-FR-070-01
      requirement_id: REQ-FR-070
      statement: A simultaneous revision and approval cannot create a relationship from outdated acceptance evidence.
    - id: AC-FR-070-02
      requirement_id: REQ-FR-070
      statement: When draft B replaces draft A, only valid decisions attributable to draft B can support the eventual administrative formation approval.
    - id: AC-BR-001-01
      requirement_id: REQ-BR-001
      statement: Any Entra-authenticated employee can submit a mentor application, and only mentors approved by Talent Management appear in discovery.
    - id: AC-BR-002-01
      requirement_id: REQ-BR-002
      statement: An approved mentor with any number of existing relationships can still be selected for a new request.
    - id: AC-E2E-01
      requirement_id: REQ-BR-003
      statement: "E2E-01 End-to-end formation: all approved mentors appear; protégé requests contact; both independently agree to proceed, accept identical agreement content and Talent Management approves; State is initially In Progress. The formation-time IsActive treatment remains a pending policy choice (OPEN-002), not a silent deduction from State."
    - id: AC-E2E-02
      requirement_id: REQ-BR-003
      statement: "E2E-02 Missing prerequisite: with one of mutual acceptance, both agreement acceptances or administrator approval missing, no initial In Progress formation occurs."
    - id: AC-E2E-05
      requirement_id: REQ-BR-004
      statement: "E2E-05: One participant accepts draft A; a substantive change produces draft B, resets to Step 1 and invalidates the applicability of all draft A decisions without deleting history. Both parties accept B, then Talent Management approves. After formation the accepted agreement is immutable."
    - id: AC-E2E-04
      requirement_id: REQ-BR-005
      statement: "E2E-04 Goal workflow: progress does not require approval; completion request remains visibly pending and incomplete until the mentor alone approves. A mentor rejection remains auditable, leaves the goal incomplete and introduces no extra administrator stage, reason mandate or resubmission loop."
    - id: AC-BR-006-01
      requirement_id: REQ-BR-006
      statement: A formed relationship accepts only In Progress, On hold or Complete as State, each reachable from each other by an administrator; an unformed candidate cannot be given a State; no "Unknown" State value exists.
    - id: AC-BR-007-01
      requirement_id: REQ-BR-007
      statement: Status accepts only Needs reassigning or blank; setting Needs reassigning changes no other attribute and starts no reassignment workflow.
    - id: AC-BR-008-01
      requirement_id: REQ-BR-008
      statement: The formation-time IsActive value is an outstanding business decision (OPEN-002); formed relationships accept Y/N independently of State/Status, and legacy Active text is not blindly copied.
    - id: AC-E2E-03
      requirement_id: REQ-BR-009
      statement: "E2E-03 Independent administration: for a formed relationship, admin saves Complete + Needs reassigning + IsActive=Y, then On hold + blank + IsActive=N; both are retained and audited. Neither change triggers reassignment."
    - id: AC-BR-010-01
      requirement_id: REQ-BR-010
      statement: An agreement can be saved with duration 6 months, 12 months or 12+ months, and a 12+ agreement can be saved without an end date.
    - id: AC-BR-011-01
      requirement_id: REQ-BR-011
      statement: An agreement of any duration category can be saved with StartDate and/or EndDate empty.
    - id: AC-BR-012-01
      requirement_id: REQ-BR-012
      statement: Formation relies on two separately recorded digital acceptances and no handwritten signature or scanned document is required.
    - id: AC-E2E-08
      requirement_id: REQ-BR-013
      statement: "E2E-08 Confidentiality: administrator views goals/progress but cannot access private discussions via UI, API, export or logs."
    - id: AC-BR-015-01
      requirement_id: REQ-BR-015
      statement: Profile creation and maintenance complete successfully with no Data Lake or employee-profile integration configured.
    - id: AC-E2E-07
      requirement_id: REQ-BR-016
      statement: 'E2E-07 Legacy record: a validated historical row can be entered manually and reported with its real source provenance, unresolved/missing dates and legacy classification; unresolved identities remain review exceptions; no fabricated digital agreements, acceptances, approvals or timestamps. "ongoing" is not turned into a date, and "Active" is not blindly used as IsActive.'
    - id: AC-BR-017-01
      requirement_id: REQ-BR-017
      statement: Meeting/review commitments appear in the accepted agreement without automatic reminders, policing or completion rules.
    - id: AC-BR-018-01
      requirement_id: REQ-BR-018
      statement: The accepted agreement carries the meeting confidentiality commitment; no field, API or report exists for private discussion notes; structured goals and progress are visible to the permitted roles.
    - id: AC-BR-019-01
      requirement_id: REQ-BR-019
      statement: A draft acceptance from superseded content never satisfies the new draft approval prerequisites.
    - id: AC-BR-020-01
      requirement_id: REQ-BR-020
      statement: A record of an allowed non-substantive change shows permission basis, actual actor, time and changed field/content; the accepted meaning is unchanged.
    - id: AC-BR-021-01
      requirement_id: REQ-BR-021
      statement: Changing a named party before formation invalidates the original pairing/acceptances; operational State remains unavailable until current formation prerequisites are satisfied.
    - id: AC-DR-001-01
      requirement_id: REQ-DR-001
      statement: A digitally authenticated employee record carries its Entra object identifier, display name and optional level/title; a historical name without a resolved Entra identity cannot create an employee record.
    - id: AC-DR-002-01
      requirement_id: REQ-DR-002
      statement: A mentor profile carries employee, biography, role/title, industry experience, mentoring experience and approval, and only an approved profile is returned by discovery.
    - id: AC-DR-003-01
      requirement_id: REQ-DR-003
      statement: A mentorship request carries protégé, motivation, technical/career goals, nontechnical expectations, date and disposition, and is retained as a record distinct from any agreement.
    - id: AC-DR-004-01
      requirement_id: REQ-DR-004
      statement: A mentor selection carries the request, candidate mentor, invitation, response and dates; a declined selection has no formed relationship.
    - id: AC-DR-005-01
      requirement_id: REQ-DR-005
      statement: A mentorship relationship carries participants, State, Status, IsActive, duration, optional dates, history and a digital-versus-legacy provenance indicator; a digitally formed relationship exists only after all prerequisites and a legacy relationship carries no invented operational values.
    - id: AC-DR-006-01
      requirement_id: REQ-DR-006
      statement: Current draft, superseded drafts and formed accepted content retain distinct stable identities; previously accepted snapshots are never modified by replacement.
    - id: AC-DR-007-01
      requirement_id: REQ-DR-007
      statement: Each acceptance references a distinct actual participant and exact draft; superseded acceptances remain auditable but inapplicable.
    - id: AC-DR-008-01
      requirement_id: REQ-DR-008
      statement: The approval records actor, candidate, current accepted agreement content and real time; superseded decisions do not satisfy formation; none are fabricated for legacy relationships.
    - id: AC-DR-009-01
      requirement_id: REQ-DR-009
      statement: A development goal carries its relationship/agreement reference, agreed description and completion status; the agreed description cannot be changed and the status changes without altering the agreement content.
    - id: AC-DR-010-01
      requirement_id: REQ-DR-010
      statement: A goal progress entry carries goal, protégé, dated progress update and an optional completion request, and its existence does not set the goal to completed.
    - id: AC-DR-011-01
      requirement_id: REQ-DR-011
      statement: A goal approval carries the completion request, mentor, approved/rejected decision and actual date/time; a pending request is not an approval and a rejection leaves the goal incomplete.
    - id: AC-DR-013-01
      requirement_id: REQ-DR-013
      statement: A meeting schedule carries the relationship, proposed/scheduled session time where available and the agreed frequency/duration, with no private notes field and no live calendar dependency.
    - id: AC-DR-014-01
      requirement_id: REQ-DR-014
      statement: An administration audit entry carries actor, action, affected record, prior/new values where applicable, true action date/time and manual-entry source reference, and distinguishes actual application events from source-claimed history.
    - id: AC-DR-015-01
      requirement_id: REQ-DR-015
      statement: A substantial revision and a permitted non-substantive edit are traceably distinguishable, and the original accepted snapshot is preserved.
    - id: AC-NFR-001-01
      requirement_id: REQ-NFR-001
      statement: In production every protected operation is authenticated through Entra and authorised at the server/API; a prototype run with labelled simulated identities still enforces server authorisation and is not recorded as production authentication acceptance.
    - id: AC-NFR-002-01
      requirement_id: REQ-NFR-002
      statement: No administrator screen, export, API or log captures or returns private meeting discussion notes.
    - id: AC-NFR-003-01
      requirement_id: REQ-NFR-003
      statement: Every stored reference between employee identities, agreements, requests, goals, relationships and recorded approvals resolves to an existing record, and an unresolved legacy identity is held as a review exception rather than replaced with a guessed employee.
    - id: AC-NFR-004-01
      requirement_id: REQ-NFR-004
      statement: For each actual acceptance, approval, goal decision, administration change and manual legacy entry, the true actor, action timestamp, relevant values and outcome are retained, and no legacy record carries an invented event timestamp.
    - id: AC-NFR-005-01
      requirement_id: REQ-NFR-005
      statement: Following acceptance and a substantive draft revision, old content is unchanged, old decisions are inapplicable, new acceptance is necessary, and no formed agreement is altered.
    - id: AC-NFR-006-01
      requirement_id: REQ-NFR-006
      statement: Protégés, mentors and administrators can complete product workflows in understandable, role-appropriate screens of the separately delivered React frontend, with the backend providing secure, consistent business outcomes for the interface.
    - id: AC-NFR-007-01
      requirement_id: REQ-NFR-007
      statement: Before production acceptance a recoverability decision (hosting, backup/recovery metrics and procedures) for the authoritative store is recorded; the prototype is not blocked by its absence.
    - id: AC-NFR-008-01
      requirement_id: REQ-NFR-008
      statement: Before production, production ownership and controlled operator/data access are defined without adding an admin module or configuration workflow to the product.
    - id: AC-NFR-009-01
      requirement_id: REQ-NFR-009
      statement: Personally attributable development information is readable only by permitted roles, is protected in storage and transit, and private meeting discussions are not exposed through records, APIs, exports or logs.
    - id: AC-NFR-010-01
      requirement_id: REQ-NFR-010
      statement: The prototype core flows run with no live calendar, Data Lake, AI inference or live notification transport, and with expressly identified identity simulation where Entra configuration is not complete.
    - id: AC-E2E-09
      requirement_id: REQ-FR-068
      statement: "E2E-09 Permitted non-substantive edit: After participant acceptance, an explicitly authorised administrative/non-substantive change is audited and leaves the acceptance workflow valid when meaning/rights/obligations/terms are unchanged. An unpermitted change cannot use the exception."
    - id: AC-E2E-10
      requirement_id: REQ-FR-070
      statement: "E2E-10 Stale formation race: Participant A accepts draft A; a substantive revision yields draft B; old acceptance and any draft-specific approval cease to be applicable. A stale attempt to form using draft A must fail. Both participants accept B and Talent Management approves B before formation."
    - id: AC-E2E-11
      requirement_id: REQ-BR-021
      statement: "E2E-11 Party change: Before formation, a party substitution invalidates the old candidate’s pairing and draft decisions; fresh matching, acceptance and formation steps for the correct named parties are needed. After formation, a new relationship is necessary."
    - id: AC-BR-022-01
      requirement_id: REQ-BR-022
      statement: A Talent Management administrator can validate and manually enter a historical relationship, and the entry is attributed to that administrator.
    - id: AC-BR-022-02
      requirement_id: REQ-BR-022
      statement: Any user who is not a Talent Management administrator, including an IT/system operator acting through the application, is refused when attempting to validate or enter a historical relationship.
    - id: AC-FR-071-01
      requirement_id: REQ-FR-071
      statement: A newly formed relationship has IsActive = N without any actor supplying a value.
    - id: AC-FR-071-02
      requirement_id: REQ-FR-071
      statement: IsActive accepts only the values Y and N; any other value is rejected.
    - id: AC-FR-071-03
      requirement_id: REQ-FR-071
      statement: A Talent Management administrator can later change the defaulted IsActive value, and that explicit choice is not overwritten by the default (FR-049, FR-050).
    - id: AC-BR-023-01
      requirement_id: REQ-BR-023
      statement: A Talent Management administrator can make an administrative or non-substantive draft change after acceptance without resetting the draft workflow; the change is audited with actor, time, permission basis and changed content, and the accepted snapshot is not overwritten.
    - id: AC-BR-023-02
      requirement_id: REQ-BR-023
      statement: A participant or any other non-administrator cannot make a no-reset draft change; a change that alters meaning, obligations, rights, parties, goals or terms cannot use the exception and follows FR-067.
    - id: AC-DR-016-01
      requirement_id: REQ-DR-016
      statement: A historic source row whose person is absent from the Entra directory is retained with its source provenance and marked as a review exception.
    - id: AC-DR-016-02
      requirement_id: REQ-DR-016
      statement: No employee record or Entra identity is created for a historic person who cannot be resolved against the Entra directory.
  assumptions:
    - "BRS status (DAR-MENT-BRS-0001 v0.3.0): Candidate — business approval outstanding. Candidate status does not reopen settled functional decisions; Talent Management must still approve the complete BRS as a document before the formal business baseline (§header, §11.1)."
    - Business behaviour is specified in the BRS; tables, routes and UI structures remain architecture and design decisions (Document control).
    - Data requirements DR-001–DR-015 are conceptual business information needs, not prescribed database tables; AgreementDraftRevision is not an instruction to create a separate revision table (§7).
    - "Demonstrator boundary (§2.3): the first demonstrator must cover the three roles and the principal formation, draft-revision, goal, administration and reporting flows. Labelled simulated identities and simulated notification outcomes are acceptable if production integrations are unavailable; server-side authorisation still applies. Entra integration, security, data protection and operating-readiness targets must be demonstrated or decided before production acceptance; a prototype does not satisfy them."
    - "Delivery allocation (§2.4): the .NET backend and PostgreSQL authoritative store own data integrity, business rules, identity association, permission checks, workflow states and audits. A separately delivered React frontend created using Vercel v0 consumes those APIs and owns user interaction; frontend implementation cannot substitute for backend rule enforcement. API routes, schema design, deployment and visual component structure are architecture decisions."
    - "Permission-design obligation (§3): architecture must produce a server-side actor/resource/action matrix for draft revisions, candidate visibility, withdrawn requests, acceptance, audit, goals and reports; unspecified permissions must not default to broad access."
    - "Actor access boundaries (§3): Employee/prospective protégé — only own data and intentionally shared discoverable mentor data. Protégé — only relationships and candidate records in which they participate. Mentor applicant — not discoverable until Talent Management approval. Approved mentor — not a Talent Management administrator. Talent Management administrator — cannot view private discussion content; draft/approval actions are audited. IT/system operator — no automatic business-record permissions from technical operator access."
    - "Scope exclusion (§2.2): post-formation agreement amendments — no change of signed terms, named parties, agreed goals or agreed mentor inside an existing formed relationship; a different agreement/mentor requires a new request and relationship."
    - "Scope exclusion (§2.2): in-place mentor reassignment, goal carry-forward, goal wording amendment and associated approval workflows."
    - "Scope exclusion (§2.2): AI ranking/recommendations/automated matching, numeric capacity restriction, and automatic approved-mentor unavailability suppression."
    - "Scope exclusion (§2.2): live calendar synchronisation, availability search, production rescheduling management or automatically enforced meeting commitments."
    - "Scope exclusion (§2.2): automated legacy import, live profile/Data Lake dependencies and private meeting discussion notes."
    - "Scope exclusion (§2.2): automatic restrictions or recalculation of unusual formed-relationship State / Status / IsActive combinations."
    - "Scope exclusion (§2.2): automatic goal completion escalation, mandated rejection reasons and resubmission loops."
    - "Scope exclusion (§2.2): unapproved general access to mentorship details and performance-management/promotion integration."
    - "Not excluded (§2.2): a substantive pre-formation draft revision is allowed under a full Step 1 reset; it is not a mutation of accepted snapshot content or an amendment to a formed relationship."
    - "WF-01 (§4): Employee registers → Talent Management approves or declines → only approved mentors appear in discovery. Existing relationships do not hide an approved mentor. No mentor self-withdrawal/deactivation filter in MVP."
    - "WF-02 (§4): Employee submits original request questions → browses approved mentors → selects candidate → invitation and response recorded → introductory conversation arranged outside the app if needed → mentor and protégé independently confirm willingness to proceed. Declined or withdrawn pairings are not formed relationships."
    - "WF-03 (§4): Step 1 draft preparation (draft has a distinct content identity) → Step 2 current-draft acceptance by each participant independently → Step 3 Talent Management formation approval → Step 4 formed In Progress relationship with fixed agreement content. Substantive pre-formation revision after either acceptance returns to Step 1; pairing decisions remain effective only if the same parties and independently valid pairing remain. After formation no draft-replacement path can modify the formed agreement."
    - "WF-04 (§4): Protégé submits dated progress against immutable agreed goal wording → may request completion → mentor independently approves or rejects → request outcome and goal status retained. No automatic retry/escalation."
    - "WF-05 (§4): Talent Management may change State among In Progress/On hold/Complete in either direction, set/clear Status Needs reassigning and set IsActive Y/N independently; no admin edit bypasses formation or triggers mentor reassignment; actor, timestamp and old/new values are audited."
    - "WF-07 (§4): An authorised person validates and manually enters historical relationships through a controlled existing mechanism, resolving real identities and maintaining source-row provenance; Talent Management can view/export the authorised register. Not an automatic importer or newly mandated admin screen."
    - "INT-001: After formation, goals/terms are fixed; progress and completion are separate facts. Before formation, draft reset permits fresh content without editing earlier accepted snapshots."
    - "INT-002: A formed relationship retains its named mentor; a different mentor requires a new relationship; no carry-forward/transfer."
    - "INT-003: An unformed candidate has no operational State; administrative State edits cannot bypass formation."
    - "INT-004: Ordinary progress is not approval-gated; the mentor alone approves/rejects completion; no extra administrator stage."
    - "INT-005: Authenticated initial request submission does not require a separate signature; separate digital acceptance applies to the agreement only."
    - "INT-006: Introductions can be arranged outside the application; no live calendar integration."
    - "INT-007: Complete is reversible for formed relationships; no irreversible termination workflow."
    - "INT-008: Private meeting discussions are excluded; goals/progress are structured without private notes."
    - "INT-009: Meeting and review commitments are recorded but not policed; no reminder, timer or automatic closure."
    - "INT-010: Formed relationships require explicit Y/N IsActive; formation-time actor/value remains OPEN-002; admin overrides remain authoritative."
    - "INT-011: Substantive accepted-draft changes before formation supersede the draft and reset Step 1; old evidence retained, old decisions invalid, new acceptances and approval needed."
    - "INT-012: Explicitly permitted, recorded non-substantive changes preserve approval workflow state; no blanket exemption without permission rule or when meaning/terms change."
    - "Settled decisions (§11.1): DEC-001 immutable formed agreements and fixed agreed goals; DEC-002 no in-place mentor reassignment; DEC-003 independent State/Status/IsActive on formed relationships; DEC-004 meeting/review commitments recorded without automatic enforcement; DEC-005 accepted-draft substantive changes before formation reset to Step 1, permitted/recorded non-substantive changes exempt; DEC-006 all approved mentors remain discoverable, availability suppression excluded; DEC-008 no rejected-completion retry/escalation/reason workflows."
    - "EXT-001: Production Microsoft Entra configuration/test identities — owner IT identity team; gate: production identity acceptance; prototype may simulate expressly."
    - "EXT-002: Hosting, backup, security operation, authorised database access — owner IT/platform owner; gate: production."
    - "EXT-003: Calendar API access — owner IT collaboration team; outside MVP."
    - "EXT-004: Formal BRS approval, historical entry authority and initial IsActive decision — owner Talent Management + IT as applicable; gate: baseline and relevant functional acceptance."
    - "EXT-005: Whitelist/permission policy for administrative or non-substantive draft edits — owner Talent Management / designated owner; gate: before such no-reset edits are enabled; otherwise block them."
    - "Production readiness (§8, §11.3), not prototype blockers: hosting and recoverability metrics, operator/data-access model, POPIA controls and retention, accessibility/browser support, security evidence and production Entra integration must be resolved before production acceptance. No numerical targets are specified."
    - NFR-007 and NFR-008 rest on a prior v0.2 design assumption and are DEFERRED to before production acceptance.
    - "Authoritative and privacy boundaries (§7.2): Entra authenticates active employees; the application database is authoritative for mentorship operations, approvals and current draft status; every accepted content snapshot is preserved unchanged; the formed agreement is immutable; the tracker remains source/provenance and a reporting shape, never a concurrently edited second operational source; private meeting discussions are never captured, returned or logged."
    - "Retired IDs remain retired and their removed behaviours may not be inferred: FR-038, FR-041, FR-042, FR-052, FR-053, BR-014, DR-012, WF-06, E2E-06 (§5, §6, §7, §9, §11.5)."
    - Acceptance criteria in BRS §5–§9 are product-level tests; backend authorisation and integrity cannot be delegated solely to the frontend (§11.5).
    - The BRS evidence register cites SRC-01–SRC-06 (discovery document, Mentorship Form, Mentorship Agreement, Mentorship Tracker 2026, user-confirmed decisions 14–15 Oct 2026, user instruction 20 Oct 2026); these are not supplied in the Project Pack and are cited here only through the BRS.
    - OPEN-001 to OPEN-004 were closed by the product_domain authority on 27 Oct 2026 and are now requirements REQ-BR-022 (historical entry authority), REQ-FR-071 (initial IsActive defaults to N), REQ-BR-023 (no-reset draft changes, Talent Management administrator only) and REQ-DR-016 (unresolved historic identities). Wherever verbatim BRS text elsewhere in this specification calls these matters open or pending (BR-008, AC-FR-046-01, AC-FR-063-04, AC-BR-008-01, AC-E2E-01, INT-010, EXT-004, EXT-005), those four requirements take precedence.
    - Desired business outcomes (§1) — improved mentor visibility, reduced administrative handling, auditable acceptance/approval, visible goal progress, consistent register — are not yet numerically baselined; metrics are a separate business decision.
    - "Legacy tracker mapping (§7.1) is candidate interpretation requiring per-row validation: dates in the tracker are written day/month/year (DD/MM/YYYY) and are read in that format (product_domain decision, 27 Oct 2026); 'Active: Successfully complete' → State=Complete (Status/IsActive unresolved); 'Active: put on hold' → State=On hold (Status/IsActive unresolved); 'Active: No - needs reassigning' → Status=Needs reassigning (IsActive=N not authorised automatically; State unresolved); 'Active: Yes' → potential State=In Progress and/or IsActive=Y (proposed only); 'Active: blank' → unknown, no automatic default."
    - Legacy tracker Row 8 Start Date '10/1/2026' is read as day/month/year, i.e. 10 January 2026 (§7.1; product_domain decision, 27 Oct 2026).
    - Legacy tracker Rows 9 and 18 have no mentor; unresolved source relationship — do not fabricate mentor, agreement or acceptance evidence (§7.1).
    - "Legacy 'End/Duration: ongoing' keeps the original text with unknown EndDate; legacy 'Duration: 6 months' maps to the 6-month category only if the record is otherwise validated (§7.1)."
  ambiguities:
    - Exact accessibility/browser targets, retention period, POPIA compliance controls and recoverability metrics are deferred and not specified (NFR-004, NFR-006, NFR-007, NFR-009).
