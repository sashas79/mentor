# Architecture decision record derived under Engineering Harness control.
schema_version: 1
adr:
  id: ADR-005
  title: Formation as one transactional command with prerequisite re-validation and optimistic concurrency
  status: proposed
  decision: |-
    Formation approval and relationship formation are one command, ApproveFormation, executed by a
    Talent Management administrator against a candidate and the revision the administrator reviewed. The
    command runs in a single database transaction and, inside it:
    1. loads the candidate with its concurrency token and verifies that the token equals the one the
       administrator's request carries and that the referenced revision is still the candidate's current
       revision;
    2. verifies that the candidate's two parties are still the identified mentor and protégé and that
       both willingness-to-proceed decisions are current (not withdrawn, declined or invalidated by a
       party change);
    3. verifies that exactly those two parties hold applicable acceptances whose substantive_hash equals
       the current revision's substantive_hash;
    4. inserts the FormationApproval with administrator, server UTC time, candidate, revision and hashes;
    5. inserts the MentorshipRelationship with State In Progress, Status blank, IsActive N, provenance
       digital, the frozen agreement content and hashes, and one DevelopmentGoal per agreed goal;
    6. writes the audit entries and notification events.
    Any failed check, or a concurrency conflict caused by a revision or party change committed in the
    meantime, aborts the transaction and returns a conflict response; nothing is persisted. A relationship
    row therefore exists only when all prerequisites held at the moment of formation. Administrator edits
    of State, Status or IsActive are a different command that requires an existing relationship row and
    cannot create one.
  rationale: |-
    FR-030, FR-031 and FR-070 require that approval depends on current acceptances of identical current
    content and that a stale approval (E2E-10) can never form a relationship; BR-003 and E2E-02 require
    that any missing prerequisite prevents formation. Checking inside one transaction with a concurrency
    token is the only way to make the stale-formation race deterministic. Forming the relationship in the
    same transaction as the approval removes any window in which an approval exists without its
    relationship or a relationship without its approval evidence, and FR-071 fixes the initial IsActive
    value as N with no actor input.
