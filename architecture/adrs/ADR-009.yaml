# Architecture decision record derived under Engineering Harness control.
schema_version: 1
adr:
  id: ADR-009
  title: Persisted in-app notification events instead of a delivery channel
  status: proposed
  decision: |-
    Material workflow actions insert notification_event rows (CONTRACT-NOTIFICATION-EVENTS) in the same
    transaction as the action (ADR-005): mentor application decided, invitation sent, mentor responded,
    willingness to proceed recorded, replacement revision created (reset to step 1), acceptance
    recorded, formation decided, goal completion requested, goal completion decided. A row records the
    event type, the subject record, the intended recipient employee identity and role, the required
    next action, created_at, delivery = SIMULATED with delivered_at equal to created_at, and read_at.

    notification_event is an operational table, not evidence: the audit trail (ADR-007) is the evidence
    of the action, and the event is the recipient's pending-action record. The only update permitted on
    it is setting read_at, by the intended recipient through the API, under a column-level grant
    (ADR-013); rows are never deleted. The API returns the caller's own events only. The prototype
    frontend renders them as an inbox labelled "simulated delivery"; no e-mail, Teams, push, queue,
    scheduler or reminder exists. A production transport, if ever required, would consume the same
    table.
  rationale: |-
    FR-057 requires demonstrable notification events that identify the material action, recipient and
    next action, restricted to the intended recipient, with no delivery channel or production service
    implied; FR-058 and NFR-010 require the prototype to run without live transports. Keeping the event
    operational and the audit entry evidential resolves the tension between an immutable record and a
    read marker: nothing immutable is ever updated, and the evidence of the action does not depend on
    the event row.
  requirement_refs:
    - REQ-FR-057
    - REQ-FR-058
    - REQ-NFR-010
