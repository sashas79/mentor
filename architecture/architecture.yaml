    - id: COMP-PLATFORM-OPERATIONS
      name: Infrastructure, configuration and operations
      responsibility: |-
        Owns everything under infra/: the local and demonstrator environment (container definitions for the
        API, the SPA and PostgreSQL), container builds, environment configuration (Entra tenant, client and
        audience settings, connection strings with TLS, the switches for simulated identity and simulated
        notification delivery, which default off outside prototype configuration) and the legacy-entry
        script templates and database roles. Records the production-readiness decisions that the BRS defers
        to before production acceptance: hosting, backup and recovery procedure and metrics for the
        authoritative store, production ownership, controlled operator and data access, retention and
        protection controls. The prototype runs with no calendar, Data Lake, AI inference or notification
        transport, and operator access confers no business-record permission.
      requirement_refs:
        - REQ-FR-013
        - REQ-FR-058
        - REQ-NFR-001
        - REQ-NFR-007
