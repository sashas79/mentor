    - id: COMP-WEB-FRONTEND
      name: React web frontend
      responsibility: |-
        The separately deployable React single-page application (ADR-012), created with Vercel v0 and kept
        under src/web, that provides role-appropriate screens for protégés, mentors and Talent Management
        administrators: sign-in through Entra or the labelled simulated identity, own profile, mentor
        application and profile maintenance, mentor discovery, mentorship request and invitation, mentor
        response and willingness decisions, agreement draft preparation, full-content review and acceptance,
        goals, progress and completion requests and decisions, administrator approvals, relationship
        State/Status/IsActive administration, register and export, notification inbox and meeting
        schedule. It calls CONTRACT-MENTORSHIP-API through a generated typed client, renders the permitted
        actions the server reports and never enforces a business rule itself; a persistent banner marks
        simulated-identity mode.
      requirement_refs:
        - REQ-FR-001
